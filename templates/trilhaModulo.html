<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/trilhaModulo.css') }}">
    <title>Trilha de Fases</title>
</head>
<script src="https://kit.fontawesome.com/74010bf13b.js" crossorigin="anonymous"></script>
<body>
    <nav class="sidebar">
        <div class="logo">PYPO</div>
        <ul class="menu">
            <li><a href="#perfil"><i class="fa-solid fa-arrow-left" style="color: rgb(116, 192, 252);"></i>Voltar</a></li>
            <li><a href="#aprender" class="active"><i class="fa-solid fa-user" style="color: rgb(116, 192, 252);"></i>perfil</a></li>
            <li><a href="#revisar"><i class="fa-solid fa-book" style="color: rgb(116, 192, 252);"></i>Revisar</a></li>
            <li><a href="{{ url_for('loja') }}"><i class="fa-solid fa-store" style="color: rgb(116, 192, 252);"></i>Loja</a></li>
            <li><a href="{{ url_for('loja') }}"><i class="fa-solid fa-trophy" style="color: rgb(116, 192, 252);"></i>Conquistas</a></li>

        </ul>
    </nav>
    <main class="content">
        <div class="path-container">
        {% for fase in listaFases %}
            <a href="#fase{{ fase.idFase }}" class="phase">
                <div class="bubble">{{ loop.index }}</div>
                
                <span class="phase-tooltip">Fase {{ loop.index }}: {{ fase.materialApoio }}</span>
            </a>
        {% endfor %}
        </div>
    </main>
</body>
</html>
